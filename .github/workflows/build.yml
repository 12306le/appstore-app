name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: 收集产物
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk out/ 2>/dev/null || true
          ls -lh out/
          echo "APK 列表："
          for f in out/*.apk; do
            echo "  $f  $(du -h "$f" | cut -f1)"
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: appstore-apk
          path: out/*.apk
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "软件下载 v1.0.${{ github.run_number }}"
          body: |
            把 [apps.hoik.de](https://apps.hoik.de/) 打包成原生 App。

            - 页面内嵌，断网也能打开列表
            - 点击下载跳转系统浏览器 / 下载器
            - 自动跟随系统深色主题

            **安装说明**：`release` 版为正式签名，`debug` 版用于测试。首次安装需允许「安装未知来源应用」。
          files: out/*.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
